<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odoo Impact Service</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #66655f; --line: #d9d6cf; --soft: #faf9f6;
  --ok: #2e7d4f; --warn: #a2621b; --bad: #9c2f4a; --accent: #2f6f9f; --focus: #1d1d1b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161615; --panel: #1f1f1d; --ink: #ecebe6; --muted: #a09f99; --line: #3a3936; --soft: #262624;
    --ok: #6ccf95; --warn: #e0a35a; --bad: #ec7f98; --accent: #6fb0e0; --focus: #ecebe6;
  }
}
:root[data-theme="dark"] {
  --bg: #161615; --panel: #1f1f1d; --ink: #ecebe6; --muted: #a09f99; --line: #3a3936; --soft: #262624;
  --ok: #6ccf95; --warn: #e0a35a; --bad: #ec7f98; --accent: #6fb0e0; --focus: #ecebe6;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 14px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: 17px; margin: 0; }
header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
main { max-width: 1180px; margin: 0 auto; padding: 16px; }
button, .btn { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--soft); color: var(--ink); border-radius: 6px; padding: 6px 10px; cursor: pointer; text-decoration: none; display: inline-block; white-space: nowrap; }
button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
button:disabled { opacity: .5; cursor: default; }
button:focus-visible, .btn:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
input, textarea, select { font: inherit; font-size: 13px; width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
textarea { min-height: 64px; font-family: ui-monospace, monospace; }
label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 16px; }
.card-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.card-head h2 { font-size: 15px; margin: 0; }
.card-head small { color: var(--muted); word-break: break-all; }
.form { padding: 4px 14px 14px; display: none; }
.form.open { display: block; }
.card:has(> .form:not(.open)) { display: none; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 8px 14px; border-top: 1px solid var(--line); vertical-align: top; font-size: 13px; }
th { font-size: 12px; color: var(--muted); font-weight: 500; border-top: 0; }
td.path { word-break: break-all; color: var(--muted); font-size: 12px; }
td .branch { font-weight: 600; color: var(--ink); font-size: 13px; }
.badge { display: inline-block; white-space: nowrap; font-size: 12px; padding: 1px 7px; border-radius: 10px; border: 1px solid currentColor; }
.ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); } .muted { color: var(--muted); }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }
.sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
.panel { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 30; }
.panel.open { display: flex; }
.panel > div { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; width: min(1000px, 100%); max-height: 90vh; display: flex; flex-direction: column; }
.panel header { position: static; border-radius: 8px 8px 0 0; }
.panel pre { margin: 0; padding: 14px; overflow: auto; font-size: 12px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 14px; border-bottom: 1px solid var(--line); align-items: center; }
.toolbar input, .toolbar select { width: auto; flex: 1 1 200px; }
.empty { color: var(--muted); padding: 20px 14px; }
.toolbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); }
.toolbar input[type=text], .toolbar input:not([type]) { width: auto; flex: 1 1 240px; }
label.check { display: flex; gap: 6px; align-items: center; margin: 0; font-size: 13px; color: var(--ink); white-space: nowrap; }
label.check input { width: auto; flex: none; margin: 0; }
tr.wc td { background: var(--soft); }
a.primary-link { background: var(--ink); color: var(--bg); border-color: var(--ink); }
code { font-family: ui-monospace, monospace; font-size: 12px; background: var(--soft); padding: 1px 5px; border-radius: 4px; word-break: break-all; }
.hint { color: var(--muted); font-size: 13px; }
@media (max-width: 760px) {
  .grid2 { grid-template-columns: 1fr; }
  thead { display: none; }
  table, tbody, tr, td { display: block; width: 100%; }
  tr { border-top: 1px solid var(--line); padding: 6px 0; }
  td { border: 0; padding: 4px 14px; }
}
</style>
</head>
<body>
<header>
  <div>
    <h1>Odoo Impact</h1>
    <p>Pick a branch, Generate its graph from the code, open it as an interactive diagram, see what it changes.</p>
  </div>
  <button class="primary" id="addToggle" aria-expanded="false" aria-controls="addForm">Add project</button>
</header>
<main>
  <section class="card">
    <form class="form" id="addForm">
      <div class="grid2">
        <div>
          <label for="repo">Git repository with your custom addons (any worktree of it)</label>
          <input id="repo" required placeholder="/home/me/projects/odoo/custom/my-addons">
        </div>
        <div>
          <label for="name">Name (optional)</label>
          <input id="name" placeholder="my-addons">
        </div>
        <div>
          <label for="conf">odoo.conf (optional, its addons_path gives the Odoo / Enterprise folders)</label>
          <input id="conf" placeholder="/home/me/projects/odoo/conf/odoo.conf">
        </div>
        <div>
          <label for="modules">Modules to treat as installed (optional, comma-separated)</label>
          <input id="modules" placeholder="leave empty: all custom modules + dependencies">
        </div>
      </div>
      <label for="core">Core folders, one per line (Odoo source, Enterprise, OCA) when there is no odoo.conf</label>
      <textarea id="core" placeholder="/home/me/projects/odoo/odoo17&#10;/home/me/projects/odoo/enterprise"></textarea>
      <p class="hint" id="addMsg" role="status"></p>
      <button class="primary" type="submit">Save project</button>
    </form>
  </section>
  <div id="projects"><p class="empty">Loading…</p></div>
  <p class="hint">AI agents: <code>odoo-impact mcp --auto</code> serves the graph of the folder the agent works in
    (Claude Code: <code>claude mcp add odoo-impact -s user -- odoo-impact mcp --auto</code>).</p>
</main>

<div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
  <div>
    <header><h1 id="panelTitle">Result</h1><button id="panelClose">Close</button></header>
    <div class="toolbar" id="panelTools"></div>
    <pre id="panelText"></pre>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api = async (path, body) => {
  const res = await fetch(path, body === undefined ? {} : {
    method: 'POST', headers: {'Content-Type': 'application/json', 'X-Odoo-Impact': '1'}, body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
};
const ago = t => {
  if (!t) return '';
  const s = Math.max(0, Date.now() / 1000 - t);
  if (s < 90) return 'just now';
  if (s < 5400) return Math.round(s / 60) + ' min ago';
  if (s < 129600) return Math.round(s / 3600) + ' h ago';
  return Math.round(s / 86400) + ' days ago';
};
const ui = JSON.parse((() => { try { return localStorage.getItem('oig-ui') || '{}'; } catch (e) { return '{}'; } })());
const saveUi = () => { try { localStorage.setItem('oig-ui', JSON.stringify(ui)); } catch (e) {} };
let projects = [];
const branchCache = {};
const polling = new Set();

function badge(state, job) {
  if (job && ['running', 'queued'].includes(job.state)) return `<span class="badge warn">${job.state}…</span>`;
  if (job && job.state === 'failed') return `<span class="badge bad">failed</span> <a href="#" data-log="${job.id}">log</a>`;
  return {'up to date': '<span class="badge ok">up to date</span>', 'outdated': '<span class="badge warn">outdated</span>'}[state] || '<span class="badge muted">no graph</span>';
}
const busy = job => job && ['running', 'queued'].includes(job.state);

function actions(p, ref, key, job, label) {
  return `<div class="actions">
    <button data-build="${esc(ref)}" data-project="${p.id}" ${busy(job) ? 'disabled' : ''}>${key ? 'Regenerate' : 'Generate'}</button>
    ${key ? `<a class="btn primary-link" href="/diagram?project=${p.id}&build=${encodeURIComponent(key)}">Diagram</a>
    <button data-diff="${esc(key)}" data-project="${p.id}" data-label="${esc(label)}">Changes</button>` : ''}
  </div>`;
}

function renderProject(p) {
  const st = ui[p.id] || (ui[p.id] = {remote: false, filter: '', limit: 25});
  const wc = p.working_copy;
  const all = branchCache[p.id] || [];
  const f = st.filter.toLowerCase();
  const list = all.filter(b => (st.remote || !b.remote) && (!f || b.ref.toLowerCase().includes(f) || b.subject.toLowerCase().includes(f)));
  const rows = list.slice(0, st.limit).map(b => `
    <tr>
      <td><div class="branch">${esc(b.ref)}</div><div class="sub">${b.remote ? 'remote' : 'local'}</div></td>
      <td><code>${esc(b.sha.slice(0, 8))}</code> ${esc(b.subject).slice(0, 110)}<div class="sub">${ago(b.date)}</div></td>
      <td>${badge(b.graph, b.job)}</td>
      <td>${actions(p, b.ref, b.key, b.job, b.ref)}</td>
    </tr>`).join('');
  return `
    <section class="card">
      <div class="card-head">
        <div><h2>${esc(p.name)}</h2><small>${esc(p.repo)}${p.conf ? ' · ' + esc(p.conf) : ''}${p.core.length ? ' · core ' + esc(p.core.join(', ')) : ''}</small></div>
        <button data-del="${p.id}" aria-label="Remove project ${esc(p.name)}">Remove</button>
      </div>
      <table>
        <thead><tr><th>Branch</th><th>Last commit</th><th>Graph</th><th>Actions</th></tr></thead>
        <tbody>
          <tr class="wc">
            <td><div class="branch">Working copy</div><div class="sub">${esc(wc.branch)} · files on disk${wc.dirty ? ', <b>uncommitted edits</b>' : ''}</div></td>
            <td><code>${esc((wc.head || '').slice(0, 8))}</code> ${esc(wc.subject).slice(0, 110)}<div class="sub">${wc.built_at ? 'built ' + ago(wc.built_at) : ''}</div></td>
            <td>${badge(wc.graph, wc.job)}</td>
            <td>${actions(p, '__wc__', wc.key, wc.job, 'working copy')}</td>
          </tr>
        </tbody>
      </table>
      <div class="toolbar">
        <input data-filter="${p.id}" value="${esc(st.filter)}" placeholder="Filter branches by name or commit" aria-label="Filter branches">
        <label class="check"><input type="checkbox" data-remote="${p.id}" ${st.remote ? 'checked' : ''}> include remote (origin/…)</label>
        <span class="sub">${list.length} branch(es), newest commit first</span>
      </div>
      <table>
        <tbody>${rows || '<tr><td colspan="4" class="empty">No branch matches.</td></tr>'}</tbody>
      </table>
      ${list.length > st.limit ? `<p style="padding:0 14px 12px"><button data-more="${p.id}">Show ${Math.min(25, list.length - st.limit)} more</button></p>` : ''}
    </section>`;
}

function render() {
  const root = $('#projects');
  if (!projects.length) {
    root.innerHTML = '<section class="card"><p class="empty">No project yet. Press <b>Add project</b>, give the git repository of your custom addons and its odoo.conf (or the Odoo / Enterprise folders).</p></section>';
    return;
  }
  const focus = document.activeElement && document.activeElement.dataset && document.activeElement.dataset.filter;
  root.innerHTML = projects.map(renderProject).join('');
  if (focus) { const i = document.querySelector(`[data-filter="${focus}"]`); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
}

async function refresh() {
  try {
    projects = (await api('/api/projects')).projects;
    await Promise.all(projects.map(async p => { branchCache[p.id] = (await api(`/api/branches/${p.id}`)).branches; }));
    render();
    for (const p of projects) {
      if (busy(p.working_copy.job)) poll(p.working_copy.job.id);
      for (const b of branchCache[p.id]) if (busy(b.job)) poll(b.job.id);
    }
  } catch (e) { $('#projects').innerHTML = `<p class="empty bad">${esc(e.message)}</p>`; }
}

async function poll(jid) {
  if (polling.has(jid)) return;
  polling.add(jid);
  for (;;) {
    await new Promise(r => setTimeout(r, 1200));
    const job = await api('/api/jobs/' + jid).catch(() => null);
    if (!job || !['queued', 'running'].includes(job.state)) break;
  }
  polling.delete(jid);
  refresh();
}

function openPanel(title, tools, text) {
  $('#panelTitle').textContent = title;
  $('#panelTools').innerHTML = tools;
  $('#panelText').textContent = text;
  $('#panel').classList.add('open');
  ($('#panelTools input') || $('#panelClose')).focus();
}
function closePanel() { $('#panel').classList.remove('open'); }

async function showDiff(pid, key, label, base) {
  const tools = `<label for="base" style="margin:0">Compare with</label>
    <input id="base" value="${esc(base)}" placeholder="origin/preprod, master, HEAD (uncommitted)…">
    <button class="primary" id="runDiff">Show</button>`;
  openPanel(`What ${label} changes`, tools, 'Working…');
  $('#runDiff').onclick = () => showDiff(pid, key, label, $('#base').value || 'HEAD');
  $('#base').onkeydown = e => { if (e.key === 'Enter') $('#runDiff').click(); };
  try {
    const r = await api(`/api/diff/${pid}/${encodeURIComponent(key)}?base=${encodeURIComponent(base)}`);
    $('#panelText').textContent = r.text;
  } catch (e) { $('#panelText').textContent = e.message; }
}

document.addEventListener('click', async ev => {
  const t = ev.target.closest('[data-build],[data-del],[data-diff],[data-log],[data-more]');
  if (!t) return;
  ev.preventDefault();
  try {
    if (t.dataset.build) {
      t.disabled = true;
      const {job} = await api('/api/build', {project: t.dataset.project, ref: t.dataset.build});
      await refresh();
      poll(job);
    } else if (t.dataset.del) {
      if (confirm('Remove this project from the list? Its graphs and diagrams stay on disk.')) { await api(`/api/projects/${t.dataset.del}/delete`, {}); refresh(); }
    } else if (t.dataset.diff) {
      showDiff(t.dataset.project, t.dataset.diff, t.dataset.label, t.dataset.diff === 'wc' ? 'HEAD' : (ui.base || 'origin/preprod'));
    } else if (t.dataset.log) {
      const job = await api('/api/jobs/' + t.dataset.log);
      openPanel('Build log', '', job.log.join('\n'));
    } else if (t.dataset.more) {
      ui[t.dataset.more].limit += 25; saveUi(); render();
    }
  } catch (e) { alert(e.message); refresh(); }
});
document.addEventListener('input', ev => {
  const f = ev.target.dataset && ev.target.dataset.filter;
  if (f) { ui[f].filter = ev.target.value; ui[f].limit = 25; saveUi(); render(); }
});
document.addEventListener('change', ev => {
  const r = ev.target.dataset && ev.target.dataset.remote;
  if (r) { ui[r].remote = ev.target.checked; saveUi(); render(); }
});
$('#panelClose').onclick = closePanel;
$('#panel').addEventListener('click', e => { if (e.target.id === 'panel') closePanel(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });

$('#addToggle').onclick = () => {
  const open = $('#addForm').classList.toggle('open');
  $('#addToggle').setAttribute('aria-expanded', String(open));
  if (open) $('#repo').focus();
};
$('#addForm').onsubmit = async e => {
  e.preventDefault();
  $('#addMsg').textContent = 'Saving…';
  try {
    await api('/api/projects', {
      repo: $('#repo').value.trim(), name: $('#name').value.trim(), conf: $('#conf').value.trim(),
      modules: $('#modules').value.trim(), core: $('#core').value.split('\n').map(s => s.trim()).filter(Boolean),
    });
    $('#addMsg').textContent = '';
    $('#addForm').reset();
    $('#addForm').classList.remove('open');
    $('#addToggle').setAttribute('aria-expanded', 'false');
    refresh();
  } catch (err) { $('#addMsg').textContent = err.message; }
};
refresh();
</script>
</body>
</html>
